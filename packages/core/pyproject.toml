[project]
name = "chickadee-core"
version = "0.0.0"
description = "The Chickadee engine: roles, task loop, edit port, sandbox and journal."
license = "AGPL-3.0-or-later"
authors = [{ name = "Kundan Kumar", email = "kundan91700@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "openai==3.19.2",
    "anthropic==1.8.0",
    "httpx2>=2.13",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.25.1",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-swift==0.7.4",
    "tree-sitter-scala==0.26.3",
    "pillow>=11",
    "regex>=2024.11.6",
    "pypdf>=6",
    # Python's language server and linter (`profiles/python.toml`), shipped so a Python
    # repository's files have verdicts with nothing to install. basedpyright bundles Node
    # (`nodejs-wheel`), so its first start downloads nothing: a run's sandbox has no network.
    "basedpyright>=1.31",
    "ruff>=0.6",
]

[project.optional-dependencies]
# The `lightpanda` fetch engine, a browser the person installs. AGPL-3.0, run
# unmodified as a separate process and never bundled. Its wheels are for Linux and macOS only.
web = ["lightpanda>=1.0.2; sys_platform != 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chickadee"]
