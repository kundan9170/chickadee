# --- arms ---------------------------------------------------------------------
# Only the arms that exist.
#
# `hard_cost_usd` is a CAP, not an estimate. Crossing it ends the run with rows on
# disk under the preregistered missing rule. Set from problem count times a generous
# per-problem ceiling, deliberately loose enough that hitting it means something is wrong.

[[arms]]
name = "e1-naive"
harness = "chickadee-eval:e1_naive"
harness_version = "0.0.0"
slm_model = "TBD"
hard_cost_usd = 25.0

[[arms]]
name = "e1-stock-diagnostic"
harness = "aider"
harness_version = "TBD"
frontier_model = "TBD"
hard_cost_usd = 40.0

# The complete system (`arms/chickadee.py`). Its models are the person's own config,
# recorded per run in the archive's `config.json` (`engine`), not here: one arm, measured
# under whatever models it is given, and two configs are two archives.
[[arms]]
name = "e1-chickadee"
harness = "chickadee-eval:chickadee"
harness_version = "0.0.0"
hard_cost_usd = 60.0
