[project]
name = "chickadee-wire"
version = "0.0.0"
description = "Typed client for the Chickadee server."
license = "AGPL-3.0-or-later"
authors = [{ name = "Kundan Kumar", email = "kundan91700@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    # `frames` and `routes` only, which import no engine; `host.py` alone uses the rest.
    "chickadee-serve",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chickadee_wire"]
