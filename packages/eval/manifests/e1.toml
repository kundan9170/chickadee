# --- perturbed set: 20 (8 python, 12 javascript) ------------------------------
# Contamination control. Each entry is a seeded perturbation of the confirmation
# problem of the same name, generated by `problems/perturb.py` with the seed below.
#
# Drawn from the CONFIRMATION set, not from dev, because the comparison is between the
# between-arm delta on the perturbed set and the between-arm delta on "the original set" —
# and at a gate the original set is confirmation. Perturbations of dev problems would put
# the two deltas on different populations and compare them anyway.
#
# The cost of that choice, stated rather than buried: iterating on perturbation quality by
# reading perturbed results is indirect exposure to holdout signal. Generating the set is
# not tuning, but reading its per-problem outcomes and changing the generator would be.
[[subsets]]
name = "e1-perturbed"
kind = "perturbed"
seed = 20260820
problems = [
  { id = "python/exercises/practice/affine-cipher-perturbed", language = "python" },
  { id = "python/exercises/practice/connect-perturbed", language = "python" },
  { id = "python/exercises/practice/grade-school-perturbed", language = "python" },
  { id = "python/exercises/practice/phone-number-perturbed", language = "python" },
  { id = "python/exercises/practice/scale-generator-perturbed", language = "python" },
  { id = "python/exercises/practice/tree-building-perturbed", language = "python" },
