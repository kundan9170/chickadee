name = "ruby"
extensions = [".rb", ".rake"]
tree_sitter_grammar = "ruby"

[syntax]
# The grammar's parse, in process (D203 decision 3), where `ruby -c` would spawn per edit.
mode = "parse"

[tests]
globs = ["spec/**", "**/spec/**", "test/**", "**/test/**", "*_spec.rb", "*_test.rb", "test_*.rb"]
# RSpec takes spec file paths. A Minitest project overrides this (`bundle exec rails test
# {selector}` or `bundle exec rake test`).
runner = "bundle exec rspec {selector}"
timeout_s = 300

[build]
compile_cmd = ""
import_smoke = ""

[deps]
manifests = ["Gemfile"]
install_cmd = "bundle add {name}"

[examples]
snippet = """
expect({symbol}({input})).to eq({output})
"""

[conventions]
file = "conventions/ruby.md"

[lsp]
server = "ruby-lsp"

[toolchain]
# D109: the gems Gemfile.lock names, once at worktree creation.
bootstrap = ["bundle", "install"]
