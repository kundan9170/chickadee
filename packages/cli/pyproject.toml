[project]
name = "chickadee-cli"
version = "0.0.0"
description = "The chickadee command: REPL and terminal UI."
license = "AGPL-3.0-or-later"
authors = [{ name = "Kundan Kumar", email = "kundan91700@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "chickadee-core",
    # The REPL is a socket client of its own hosted engine: the wire's client, and the
    # server `chickadee serve` runs.
    "chickadee-wire",
    "chickadee-serve",
    # A prompt that streamed events print above while the person types (`repl.py`).
    "prompt-toolkit>=3.0",
    # The design gate's `e`: the design as YAML in $EDITOR (`approval.py`).
    "pyyaml>=6.0",
    # The TUI (`tui/`): one screen for Zeus, Athena and the worker.
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.scripts]
chickadee = "chickadee_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chickadee_cli"]
