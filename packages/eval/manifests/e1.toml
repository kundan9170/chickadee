# E1 problem sets — the three committed manifests.
#
# Counts are RECORDED, not assumed. Every id below was read from a real checkout of
# Aider-AI/polyglot-benchmark: 34 Python + 49 JavaScript practice exercises, 83 total.
# "~30" and "~20" in the spec are targets; what a gate run measures is this file.
#
# Ids are the problem directory relative to the benchmark root. Bare exercise names are not
# unique across languages — bottle-song, forth, book-store, grade-school and others exist in
# both — and `Subset` rejects duplicate ids, correctly. A path is also exactly what
# `polyglot.load` resolves against its root, so the id stays the thing the loader opens.
#
# Selection is a stable blake2b sort over (seed, purpose, language, id), so the split can be
# re-derived by anyone rather than taken on trust. Allocation is stratified: each language
# contributes in proportion to its share of the pool (34/83 and 49/83 of 30 -> 12 and 18).
#
# NOTE: the loader opens the stub, never the reference solution (`.meta/example.py`).

experiment = "e1"

# --- dev subset: 30 (12 python, 18 javascript) --------------------------------
# Iteration and tuning. Freely used.
[[subsets]]
name = "e1-dev"
kind = "dev"
problems = [
