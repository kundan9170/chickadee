# Chickadee engine config. Copy to ~/.config/chickadee/config.toml and edit.
# Models, prices and spend caps live here, never in a repository's own config.

# Every run has a finite hard cap in USD. Reaching it stops the run with a resumable
# terminal. Warnings fire at the listed fractions of the cap.
[spend]
hard_cost_usd = 5.00
warning_fractions = [0.5, 0.8]

# Optional: a cap per rung, beneath the total.
[spend.rungs]
high-param = 3.00

# The models you can run: any OpenAI-compatible endpoint. The key is read from the
# environment variable named here, never written to a file.
[models.frontier]
base_url = "https://api.example.com/v1"
model_id = "your-frontier-model"
api_key_env = "FRONTIER_API_KEY"
context_window = 200000
max_output_tokens = 32000

[models.local]
base_url = "http://localhost:8000/v1"
model_id = "your-local-coder"
context_window = 131072
max_output_tokens = 16384

# USD per million tokens. A model needs a row before a call to it can be charged. Price a
# local model at a hosted-market equivalent so the cap and the cost comparison stay honest.
[prices.frontier]
price_in = 3.00
price_out = 15.00

[prices.local]
price_in = 0.20
price_out = 0.60

# Which model each rung runs on. Zeus and Athena use high-param, the worker uses
# low-param, and the helper roles (locate, critic, reviewer, ...) use mid-param.
[rungs]
high-param = "frontier"
mid-param = "frontier"
low-param = "local"
