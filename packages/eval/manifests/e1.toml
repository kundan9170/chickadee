# --- smoke subset: 8 of the dev subset (4 python, 4 javascript) -----------------
# A quick check before and after a harness change: `chickadee-eval run` runs it by
# default. Drawn from dev, so it may be read and tuned on freely; a smoke number is never a
# gate number. Every stem here is dev in BOTH languages: a statement is byte-identical across
# languages, so tuning on `python/grep` would tune on `javascript/grep`, which is held out
# in the held-out set. Easy to hard: bottle-song and queen-attack, dot-dsl, ocr-numbers and rectangles,
# forth, react and alphametics.
[[subsets]]
name = "e1-smoke"
kind = "dev"
problems = [
  { id = "python/exercises/practice/bottle-song", language = "python" },
  { id = "python/exercises/practice/dot-dsl", language = "python" },
  { id = "python/exercises/practice/forth", language = "python" },
  { id = "python/exercises/practice/react", language = "python" },
  { id = "javascript/exercises/practice/alphametics", language = "javascript" },
  { id = "javascript/exercises/practice/ocr-numbers", language = "javascript" },
  { id = "javascript/exercises/practice/queen-attack", language = "javascript" },
  { id = "javascript/exercises/practice/rectangles", language = "javascript" },
]

